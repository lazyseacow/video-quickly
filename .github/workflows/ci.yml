name: Desktop verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies for type checking
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check source and validation scripts
        run: pnpm typecheck

  browser-windows:
    needs: source-checks
    name: Windows browser ${{ matrix.shard }}/4
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}\.generated\browser-shard\blob
      PLAYWRIGHT_ARTIFACT_DIR: ${{ github.workspace }}\.generated\browser-shard\artifacts
      VIDEO_QUICKLY_RPC_DIAGNOSTICS: ${{ github.workspace }}\.generated\browser-shard\browser-rpc-diagnostics.jsonl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare verified media components
        run: pnpm prepare:media
      - name: Install test browser
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: pnpm exec playwright install chromium
      - name: Record browser shard identity
        run: pnpm exec tsx scripts/browser-reports.ts record ${{ matrix.shard }} 4
      - name: Test workbench shard
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4 --workers=1 --reporter=line,blob
      - name: Upload browser shard and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-quickly-browser-windows-x64-${{ github.sha }}-shard-${{ matrix.shard }}
          path: .generated/browser-shard/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  browser-macos:
    needs: source-checks
    name: macOS ${{ matrix.arch }} browser ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            shard: 1
            shards: 2
            workers: 1
          - runner: macos-15
            arch: arm64
            shard: 2
            shards: 2
            workers: 1
          - runner: macos-15-intel
            arch: x64
            shard: 1
            shards: 4
            workers: 1
          - runner: macos-15-intel
            arch: x64
            shard: 2
            shards: 4
            workers: 1
          - runner: macos-15-intel
            arch: x64
            shard: 3
            shards: 4
            workers: 1
          - runner: macos-15-intel
            arch: x64
            shard: 4
            shards: 4
            workers: 1
    env:
      PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/.generated/browser-shard/blob
      PLAYWRIGHT_ARTIFACT_DIR: ${{ github.workspace }}/.generated/browser-shard/artifacts
      VIDEO_QUICKLY_RPC_DIAGNOSTICS: ${{ github.workspace }}/.generated/browser-shard/browser-rpc-diagnostics.jsonl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.platform!=='darwin'||process.arch!==process.env.EXPECTED_ARCH)throw Error('Runner architecture mismatch');console.log(process.platform,process.arch,process.version)"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare verified static macOS media and source notices
        run: pnpm prepare:media
      - name: Install test browser
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: pnpm exec playwright install chromium
      - name: Record browser shard identity
        run: pnpm exec tsx scripts/browser-reports.ts record ${{ matrix.shard }} ${{ matrix.shards }}
      - name: Test workbench shard
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=${{ matrix.workers }} --reporter=line,blob
      - name: Upload browser shard and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-quickly-browser-macos-${{ matrix.arch }}-${{ github.sha }}-shard-${{ matrix.shard }}
          path: .generated/browser-shard/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  verify:
    needs: browser-windows
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      release-artifact-id: ${{ steps.verification-artifact.outputs.artifact-id }}
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}\.generated\browser-results.json
      PLAYWRIGHT_ARTIFACT_DIR: ${{ github.workspace }}\.generated\browser-artifacts
      VIDEO_QUICKLY_RPC_DIAGNOSTICS: ${{ github.workspace }}\.generated\browser-rpc-diagnostics.jsonl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare verified media components
        run: node scripts/prepare-media.mjs
      - name: Download Windows browser shard 1
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-windows-x64-${{ github.sha }}-shard-1
          path: .generated/browser-artifacts/shard-1
      - name: Download Windows browser shard 2
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-windows-x64-${{ github.sha }}-shard-2
          path: .generated/browser-artifacts/shard-2
      - name: Download Windows browser shard 3
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-windows-x64-${{ github.sha }}-shard-3
          path: .generated/browser-artifacts/shard-3
      - name: Download Windows browser shard 4
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-windows-x64-${{ github.sha }}-shard-4
          path: .generated/browser-artifacts/shard-4
      - name: Merge browser reports and verify complete coverage
        run: pnpm exec tsx scripts/browser-reports.ts merge 4
      - name: Test runtime and contracts
        run: pnpm exec vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile=.generated/test-results.json
      - name: Test local HTTP CLI recovery
        run: pnpm exec tsx scripts/check-real-service-cli.ts .generated/real-service-cli-regression
      - name: Render actual media samples
        run: pnpm test:media -- --4k
      - name: Build Windows client
        run: pnpm build:desktop
      - name: Test packaged PDF parsing outside repository
        env:
          VIDEO_QUICKLY_RESEARCH_RUNTIME_STAGE: ${{ github.workspace }}\.generated\sidecar
        run: pnpm exec vitest run tests/research-packaging.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.generated/packaged-runtime-results.json
      - name: Test Electron desktop with real preload and runtime
        run: pnpm test:desktop --packaged
      - name: Verify installation and overwrite upgrade in isolated runner
        shell: pwsh
        run: |
          $taskInstallers = @(Get-ChildItem -LiteralPath '.generated/electron-release' -Filter '*-setup.exe')
          if ($taskInstallers.Count -ne 1) { throw '应恰好有一个安装包' }
          ./scripts/install-smoke.ps1 -InstallerPath $taskInstallers[0].FullName
      - name: Collect verified artifacts
        run: node scripts/collect-artifacts.mjs
      - name: Upload build and verification results
        id: verification-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-quickly-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .generated/release/
            .generated/test-results.json
            .generated/audio-failure-diagnostics/
            .generated/packaged-runtime-results.json
            .generated/electron-results.json
            .generated/electron-artifacts/
            .generated/browser-results.json
            .generated/browser-discovery.json
            .generated/browser-coverage.json
            .generated/browser-artifacts/
            .generated/browser-rpc-diagnostics.jsonl
            .generated/real-service-cli-regression/fixture-check.json
            .generated/real-service-cli-regression/run/evidence.json
            .generated/render-smoke/results.json
            .generated/install-smoke.json

  macos:
    needs: browser-macos
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            shards: 2
          - runner: macos-15-intel
            arch: x64
            shards: 4
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.generated/browser-results.json
      PLAYWRIGHT_ARTIFACT_DIR: ${{ github.workspace }}/.generated/browser-artifacts
      VIDEO_QUICKLY_RPC_DIAGNOSTICS: ${{ github.workspace }}/.generated/browser-rpc-diagnostics.jsonl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.platform!=='darwin'||process.arch!==process.env.EXPECTED_ARCH)throw Error('Runner architecture mismatch');console.log(process.platform,process.arch,process.version)"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare verified static macOS media and source notices
        run: pnpm prepare:media
      - name: Download macOS browser shard 1
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-macos-${{ matrix.arch }}-${{ github.sha }}-shard-1
          path: .generated/browser-artifacts/shard-1
      - name: Download macOS browser shard 2
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-macos-${{ matrix.arch }}-${{ github.sha }}-shard-2
          path: .generated/browser-artifacts/shard-2
      - name: Download macOS browser shard 3
        if: matrix.arch == 'x64'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-macos-${{ matrix.arch }}-${{ github.sha }}-shard-3
          path: .generated/browser-artifacts/shard-3
      - name: Download macOS browser shard 4
        if: matrix.arch == 'x64'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-quickly-browser-macos-${{ matrix.arch }}-${{ github.sha }}-shard-4
          path: .generated/browser-artifacts/shard-4
      - name: Merge browser reports and verify complete coverage
        run: pnpm exec tsx scripts/browser-reports.ts merge ${{ matrix.shards }}
      - name: Test runtime and contracts
        run: pnpm exec vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile=.generated/test-results.json
      - name: Test local HTTP CLI recovery
        run: pnpm exec tsx scripts/check-real-service-cli.ts .generated/real-service-cli-regression
      - name: Render actual media samples
        run: pnpm test:media -- --4k
      - name: Build portable macOS ZIP and app
        run: pnpm build:desktop
      - name: Verify Mach-O architecture, minimum OS and self-contained runtime
        run: node scripts/verify-macos-bundle.mjs
      - name: Test packaged PDF parsing outside repository
        env:
          VIDEO_QUICKLY_RESEARCH_RUNTIME_STAGE: ${{ github.workspace }}/.generated/sidecar
        run: pnpm exec vitest run tests/research-packaging.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.generated/packaged-runtime-results.json
      - name: Test actual macOS desktop with real preload and runtime
        run: pnpm test:desktop --packaged
      - name: Verify macOS ZIP installation, overwrite and data retention
        run: node scripts/install-macos-smoke.mjs
      - name: Collect verified macOS artifacts
        run: node scripts/collect-macos-artifacts.mjs
      - name: Upload macOS package and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-quickly-macos-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .generated/release/
            .generated/test-results.json
            .generated/audio-failure-diagnostics/
            .generated/browser-results.json
            .generated/browser-discovery.json
            .generated/browser-coverage.json
            .generated/browser-artifacts/
            .generated/browser-rpc-diagnostics.jsonl
            .generated/real-service-cli-regression/fixture-check.json
            .generated/real-service-cli-regression/run/evidence.json
            .generated/render-smoke/results.json
            .generated/packaged-runtime-results.json
            .generated/electron-results.json
            .generated/electron-artifacts/
            .generated/macos-portability.json
            .generated/macos-install-smoke.json
